name: AgentLink CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AgentLink
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Auditor Check
        run: node scripts/security-auditor.mjs

  test-and-integration:
    name: Unit & Cross-Project Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AgentLink
        uses: actions/checkout@v4
        with:
          path: AgentLink

      - name: Checkout agent-link-cli
        uses: actions/checkout@v4
        with:
          repository: cbellingan/agent-link-cli
          path: agent-link-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: AgentLink/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python CLI dependencies
        run: |
          cd agent-link-cli
          pip install cryptography qrcode

      - name: Run Python CLI Unit Tests
        run: |
          cd agent-link-cli
          python -m unittest discover tests

      - name: Install AgentLink dependencies
        run: |
          cd AgentLink
          npm ci

      - name: Run AgentLink Vitest & Cross-Project E2E Suite
        run: |
          cd AgentLink
          npm test

  build-and-smoke:
    name: Build & Synthetic Smoke Testing
    needs: [lint-and-audit, test-and-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AgentLink
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web & Server
        run: |
          npm run build:web
          npm run build:server

      - name: Start Ephemeral Server
        run: |
          node dist/server.mjs &
          sleep 2

      - name: Run Synthetic Smoke Tests
        run: node scripts/smoke-test.mjs http://localhost:3000
